<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>KidsCare clinic - Login Paciente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Barra de navegação superior -->
    <header class="topbar">
      <div class="topbar-inner">
                <nav class="topbar-menu">
          <a class="topbar-item" href="index.html">
            <span class="topbar-icon">
              <img src="img/botao-de-inicio.png" alt="Logo" style="width: 24px; height: 24px;">
            </span>
            <span class="topbar-label">Início</span>
          </a>
          <a class="topbar-item" href="agendamentos.html">
            <span class="topbar-icon">
              <img src="img/calendar.png" style="width: 24px; height: 24px;">
            </span>
            <span class="topbar-label">Agenda</span>
          </a>
          <a class="topbar-item" href="inicio-clinica.html">
            <span class="topbar-icon">
              <img src="img/info.png" style="width: 24px; height: 24px;">
            </span>
            <span class="topbar-label">Sobre</span>
          </a>
          <a class="topbar-item" href="login-paciente.html">
            <span class="topbar-icon">
              <img src="img/user.png" style="width: 24px; height: 24px;">
            </span>
            <span class="topbar-label">Perfil</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="content">
      <!-- Logo -->
      <section class="logo-row">
        <div class="logo-wrapper">
          <div class="logo-mark">
            <span class="circle circle-left"></span>
            <span class="circle circle-right"></span>
          </div>
          <div class="logo-text">
            <span class="logo-title">KidsCare clinic</span>
            <span class="logo-subtitle">Centro de Neurodiversidade</span>
          </div>
        </div>
      </section>

      <!-- Título da página -->
      <section class="page-title-row">
        <h1 class="page-title">Login Paciente</h1>
      </section>

      <!-- Card de login -->
      <section class="login-wrapper">
        <div class="login-card">
          <div class="login-card-header">
            <h2 class="login-card-title">Acesse sua conta</h2>
          </div>

          <form action="inicio-clinica.html" method="get">
            <div class="form-group">
              <label for="email" class="form-label">E-mail</label>
              <input
                id="email"
                name="email"
                type="email"
                class="form-control"
                placeholder="seu@email.com" />
            </div>

            <div class="form-group">
              <label for="senha" class="form-label">Senha</label>
              <input
                id="senha"
                name="senha"
                type="password"
                class="form-control"
                placeholder="*******"/>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Entrar
            </button>

            <div class="login-footer">
              <a href="#">Esqueci minha senha</a>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
