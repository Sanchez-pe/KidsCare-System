<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>KidsCare clinic - Bem-vindo(a)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fonte Google (opcional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Barra de navegação superior -->
    <header class="topbar">
      <div class="topbar-inner">
                <nav class="topbar-menu">
          <a class="topbar-item" href="index.html">
            <span class="topbar-icon">
              <img src="img/botao-de-inicio.png" alt="Logo" style="width: 24px; height: 24px;">
            </span>
            <span class="topbar-label">Início</span>
          </a>
          <a class="topbar-item" href="agendamentos.html">
            <span class="topbar-icon">
              <img src="img/calendar.png" style="width: 24px; height: 24px;">
            </span>
            <span class="topbar-label">Agenda</span>
          </a>
          <a class="topbar-item" href="inicio-clinica.html">
            <span class="topbar-icon">
              <img src="img/info.png" style="width: 24px; height: 24px;">
            </span>
            <span class="topbar-label">Sobre</span>
          </a>
          <a class="topbar-item" href="login-paciente.html">
            <span class="topbar-icon">
              <img src="img/user.png" style="width: 24px; height: 24px;">
            </span>
            <span class="topbar-label">Perfil</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="content">
      <!-- Logo e título da clínica -->
      <section class="logo-row">
        <div class="logo-wrapper">
          <div class="logo-mark">
            <span class="circle circle-left"></span>
            <span class="circle circle-right"></span>
          </div>
          <div class="logo-text">
            <span class="logo-title">KidsCare clinic</span>
            <span class="logo-subtitle">Centro de Neurodiversidade</span>
          </div>
        </div>
      </section>

      <!-- Título de boas-vindas -->
      <section class="welcome-row">
        <h1 class="welcome-title">Bem-vindo(a)</h1>
      </section>

      <!-- Card principal -->
      <section class="hero-card">
        <div class="hero-header">
          <div class="hero-text">
            <h2 class="hero-title">KidsCare clinic</h2>
            <p class="hero-subtitle">
              Cuidando de pessoas neurodivergentes com equipe multidisciplinar.
            </p>
          </div>
          <div class="hero-graphic">
            <div class="graphic-outer-circle">
              <span class="graphic-circle graphic-circle-left"></span>
              <span class="graphic-circle graphic-circle-right"></span>
            </div>
          </div>
        </div>

        <div class="hero-actions">
          <a class="btn btn-primary" href="login-paciente.html">
            Entrar (Paciente/Responsável)
          </a>
          <a class="btn btn-secondary" href="cadastro.html">
            Cadastrar
          </a>
          <a class="btn btn-dark" href="acesso-profissional.html">
            Sou Funcionário/Médico
          </a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
